            <div class="flex items-center space-x-3">
              <div class="flex items-center space-x-1.5">
                <label class="text-gray-400">Contorno:</label>
                <input type="color" id="strokeColorInput" value="${strokeColor}" onchange="strokeColor = this.value" class="w-6 h-5 cursor-pointer border border-gimp-border bg-transparent p-0">
              </div>
              <div class="flex items-center space-x-1.5">
                <label class="text-gray-400">Espessura:</label>
                <input type="number" min="1" max="50" value="${brushSize}" onchange="brushSize = parseInt(this.value) || 1" class="w-12 bg-gimp-dark border border-gimp-border rounded px-1 text-center text-white"> px
              </div>
              <label class="flex items-center space-x-1.5 cursor-pointer text-gray-200">
                <input type="checkbox" ${shapeFill ? 'checked' : ''} onchange="shapeFill = this.checked" class="rounded accent-blue-600">
                <span>Preencher</span>
              </label>
            </div>`;
          break;
        case 'text':
          icon = 'fa-font'; name = 'Texto';
          propsEl.innerHTML = `<span class="text-gray-400">Clique para adicionar. Arraste na alça superior para rodar com o rato. Duplo clique para editar.</span>`;
          break;
        case 'zoom':
          icon = 'fa-magnifying-glass'; name = 'Ampliação';
          propsEl.innerHTML = `<span class="text-gray-400">Arraste uma área para ampliar tendo o centro como referência.</span>`;
          break;
      }

      titleEl.innerHTML = `<i class="${icon} mr-1.5"></i> ${name}`;
    }

    function initTransformSession() {
      if (activeLayerIndex < 0) return;
      const layer = layers[activeLayerIndex];

      const bounds = getSelectionBoundingBox();

      transformSourceCanvas = document.createElement('canvas');
      transformSourceCanvas.width = bounds.width;
      transformSourceCanvas.height = bounds.height;
      const tCtx = transformSourceCanvas.getContext('2d');

      if (hasActiveSelection) {
        const selCanvas = document.createElement('canvas');
        selCanvas.width = canvasWidth;
        selCanvas.height = canvasHeight;
        const sCtx = selCanvas.getContext('2d');
        sCtx.drawImage(layer.canvas, 0, 0);
        sCtx.globalCompositeOperation = 'destination-in';
        sCtx.drawImage(selectionMaskCanvas, 0, 0);

        tCtx.drawImage(selCanvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
      } else {
        tCtx.drawImage(layer.canvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
      }

      transformBox = {
        x: bounds.minX,
        y: bounds.minY,
        width: bounds.width,
        height: bounds.height,
        angle: 0,
        scaleX: 1,
        scaleY: 1,
        shearX: 0,
        shearY: 0,
        flipH: false,
        flipV: false
      };

      activeTransformSession = true;
      document.getElementById('transformActionFloatingBar').classList.remove('hidden');
      document.getElementById('transformModeText').innerText = `A transformar: ${layer.name}`;

      renderCompositeCanvas();
      renderSelectionOverlay();
      renderToolProperties();
    }

    function renderTransformPreview(targetCtx) {
      if (!transformBox || !transformSourceCanvas) return;

      const centerX = transformBox.x + (transformBox.width * transformBox.scaleX) / 2;
      const centerY = transformBox.y + (transformBox.height * transformBox.scaleY) / 2;

      targetCtx.save();
      targetCtx.translate(centerX, centerY);
      targetCtx.rotate((transformBox.angle * Math.PI) / 180);
      targetCtx.transform(1, Math.tan((transformBox.shearY * Math.PI) / 180), Math.tan((transformBox.shearX * Math.PI) / 180), 1, 0, 0);
      targetCtx.scale(transformBox.flipH ? -transformBox.scaleX : transformBox.scaleX, transformBox.flipV ? -transformBox.scaleY : transformBox.scaleY);

      targetCtx.drawImage(transformSourceCanvas, -transformBox.width / 2, -transformBox.height / 2);
      targetCtx.restore();
    }

    function renderTransformAnchorsAndBox(ctx) {
      if (!transformBox) return;

      const w = transformBox.width * transformBox.scaleX;
      const h = transformBox.height * transformBox.scaleY;
      const cx = transformBox.x + w / 2;
      const cy = transformBox.y + h / 2;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((transformBox.angle * Math.PI) / 180);

      ctx.strokeStyle = '#3399ff';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(-w / 2, -h / 2, w, h);

      ctx.beginPath();
      ctx.setLineDash([]);
      ctx.moveTo(0, -h / 2);
      ctx.lineTo(0, -h / 2 - 20);
      ctx.stroke();

      ctx.fillStyle = '#2680eb';
      ctx.beginPath();
      ctx.arc(0, -h / 2 - 20, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      const handles = [
        { id: 'tl', x: -w / 2, y: -h / 2 },
        { id: 'tr', x: w / 2, y: -h / 2 },
        { id: 'br', x: w / 2, y: h / 2 },
        { id: 'bl', x: -w / 2, y: h / 2 }
      ];

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#2680eb';
      ctx.lineWidth = 1;

      handles.forEach(hnd => {
        ctx.fillRect(hnd.x - 3, hnd.y - 3, 6, 6);
        ctx.strokeRect(hnd.x - 3, hnd.y - 3, 6, 6);
      });

      ctx.restore();
    }

    function getAnchorHandleAtCoords(coords) {
      if (!transformBox) return null;

      const w = transformBox.width * transformBox.scaleX;
      const h = transformBox.height * transformBox.scaleY;
      const cx = transformBox.x + w / 2;
      const cy = transformBox.y + h / 2;

      const rad = (-transformBox.angle * Math.PI) / 180;
      const dx = coords.x - cx;
      const dy = coords.y - cy;
      const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
      const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

      if (Math.hypot(localX, localY - (-h / 2 - 20)) <= 8) return 'rotate';

      const handles = [
        { id: 'tl', x: -w / 2, y: -h / 2 },
        { id: 'tr', x: w / 2, y: -h / 2 },
        { id: 'br', x: w / 2, y: h / 2 },
        { id: 'bl', x: -w / 2, y: h / 2 }
      ];

      for (const hnd of handles) {
        if (Math.abs(localX - hnd.x) <= 6 && Math.abs(localY - hnd.y) <= 6) {
          return hnd.id;
        }
      }

      if (Math.abs(localX) <= w / 2 && Math.abs(localY) <= h / 2) {
        return 'center';
      }

      return null;
    }

    function updateTransformFromInputs() {
      if (!transformBox) return;
      const rotIn = document.getElementById('rotateValInput');
      const wIn = document.getElementById('scaleWInput');
      const hIn = document.getElementById('scaleHInput');
      const sxIn = document.getElementById('shearXInput');
      const syIn = document.getElementById('shearYInput');

      if (rotIn) transformBox.angle = parseFloat(rotIn.value) || 0;
      if (wIn && transformBox.width > 0) transformBox.scaleX = (parseFloat(wIn.value) || 1) / transformBox.width;
      if (hIn && transformBox.height > 0) transformBox.scaleY = (parseFloat(hIn.value) || 1) / transformBox.height;
      if (sxIn) transformBox.shearX = parseFloat(sxIn.value) || 0;
      if (syIn) transformBox.shearY = parseFloat(syIn.value) || 0;

      renderCompositeCanvas();
      renderSelectionOverlay();
    }

    function toggleFlipSession(dir) {
      if (!transformBox) return;
      if (dir === 'h') transformBox.flipH = !transformBox.flipH;
      if (dir === 'v') transformBox.flipV = !transformBox.flipV;

      renderCompositeCanvas();
      renderSelectionOverlay();
    }

    function confirmTransformSession() {
      if (!activeTransformSession || !transformBox || activeLayerIndex < 0) return;

      const layer = layers[activeLayerIndex];

      if (hasActiveSelection) {
        layer.ctx.save();
        layer.ctx.globalCompositeOperation = 'destination-out';
        layer.ctx.drawImage(selectionMaskCanvas, 0, 0);
        layer.ctx.restore();
      } else {
        layer.ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      }

      renderTransformPreview(layer.ctx);

      activeTransformSession = false;
      transformBox = null;
      transformSourceCanvas = null;
      document.getElementById('transformActionFloatingBar').classList.add('hidden');

      renderLayersList();
      renderCompositeCanvas();
      renderSelectionOverlay();
      saveHistoryState('Aplicar Transformação');
      showToast('Transformação aplicada');
    }

    function cancelTransformSession() {
      if (!activeTransformSession) return;
      activeTransformSession = false;
      transformBox = null;
      transformSourceCanvas = null;
      document.getElementById('transformActionFloatingBar').classList.add('hidden');

      renderCompositeCanvas();
      renderSelectionOverlay();
      showToast('Transformação cancelada');
    }

    function quickRotate(deg) {
      if (!activeTransformSession) initTransformSession();
      if (transformBox) {
        transformBox.angle += deg;
        renderCompositeCanvas();
        renderSelectionOverlay();
        renderToolProperties();
      }
    }

    function quickFlip(dir) {
      if (!activeTransformSession) initTransformSession();
      toggleFlipSession(dir);
    }

    function updateZoomDisplay() {
      const label = `${Math.round(zoomLevel * 100)}%`;
      const topLabel = document.getElementById('zoom-level-display');
      const bottomLabel = document.getElementById('zoom-bottom-display');
      if (topLabel) topLabel.innerText = `Zoom: ${label}`;
      if (bottomLabel) bottomLabel.innerText = label;
    }

    function applyViewportTransform() {
      const vp = document.getElementById('canvas-viewport');
      vp.style.transform = 'none';
      vp.style.transformOrigin = 'top left';
      vp.style.zoom = String(zoomLevel);
      updateZoomDisplay();
    }

    function clampZoom(value) {
      return Math.max(0.0625, Math.min(64, value));
    }

    function setZoomCenter(newZoom) {
      const workbench = document.getElementById('workbench');
      const vp = document.getElementById('canvas-viewport');
      const oldZoom = zoomLevel;
      const newValue = clampZoom(newZoom);
      if (Math.abs(newValue - oldZoom) < 0.000001) return;

      const centerX = (workbench.scrollLeft + workbench.clientWidth / 2 - vp.offsetLeft) / oldZoom;
      const centerY = (workbench.scrollTop + workbench.clientHeight / 2 - vp.offsetTop) / oldZoom;

      zoomLevel = newValue;
      applyViewportTransform();

      workbench.scrollLeft = Math.max(0, vp.offsetLeft + centerX * zoomLevel - workbench.clientWidth / 2);
      workbench.scrollTop = Math.max(0, vp.offsetTop + centerY * zoomLevel - workbench.clientHeight / 2);
    }

    function zoomToArea(x1, y1, x2, y2) {
      const left = Math.max(0, Math.min(x1, x2));
      const top = Math.max(0, Math.min(y1, y2));
      const right = Math.min(canvasWidth, Math.max(x1, x2));
      const bottom = Math.min(canvasHeight, Math.max(y1, y2));
      const rectW = right - left;
      const rectH = bottom - top;

      if (rectW < 2 || rectH < 2) {
        showToast('Desenhe um retângulo para definir a área de zoom');
        return;
      }

      const workbench = document.getElementById('workbench');
      const vp = document.getElementById('canvas-viewport');

      const margin = 16;
      const availableW = Math.max(1, workbench.clientWidth - margin * 2);
      const availableH = Math.max(1, workbench.clientHeight - margin * 2);

      const fitX = availableW / rectW;
      const fitY = availableH / rectH;
      const targetZoom = clampZoom(Math.min(fitX, fitY));

      zoomLevel = targetZoom;
      applyViewportTransform();

      const selectionCenterX = left + rectW / 2;
      const selectionCenterY = top + rectH / 2;

      workbench.scrollLeft = Math.max(0,
        vp.offsetLeft + selectionCenterX * zoomLevel - workbench.clientWidth / 2);
      workbench.scrollTop = Math.max(0,
        vp.offsetTop + selectionCenterY * zoomLevel - workbench.clientHeight / 2);

      showToast(`Zoom: ${Math.round(zoomLevel * 100)}% — área selecionada enquadrada`);
    }

    function zoomIn() { setZoomCenter(zoomLevel * 1.25); }
    function zoomOut() { setZoomCenter(zoomLevel / 1.25); }
    function resetZoom() {
      zoomLevel = 1.0;
      applyViewportTransform();
      const workbench = document.getElementById('workbench');
      workbench.scrollLeft = 0;
      workbench.scrollTop = 0;
    }

    function setupZoomAndPanEvents() {
      const workbench = document.getElementById('workbench');

      workbench.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : 0.85;
          setZoomCenter(zoomLevel * factor);
        }
      }, { passive: false });

      workbench.addEventListener('mousedown', (e) => {
        if (e.button === 1 || isSpacePressed) {
          isPanning = true;
          panStartX = e.clientX + workbench.scrollLeft;
          panStartY = e.clientY + workbench.scrollTop;
          updateWorkbenchCursor();
          e.preventDefault();
        }
      });

      window.addEventListener('mousemove', (e) => {
        if (isPanning) {
          workbench.scrollLeft = panStartX - e.clientX;
          workbench.scrollTop = panStartY - e.clientY;
        }
      });

      window.addEventListener('mouseup', () => {
        if (isPanning) {
          isPanning = false;
          updateWorkbenchCursor();
        }
      });
    }

    function setupCanvasEvents() {
      const viewport = document.getElementById('canvas-viewport');

      const getCanvasCoords = (e) => {
        const rect = compositeCanvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvasWidth / rect.width),
          y: (e.clientY - rect.top) * (canvasHeight / rect.height)
        };
      };

      const startAction = (e) => {
        if (isPanning || isSpacePressed || e.button === 1 || e.button === 2) return;
        const coords = getCanvasCoords(e);
        if (currentTool === 'pointer') return;

        if (currentTool === 'crop') {
          commitMove();
        }

        if (activeTransformSession) {
          const handle = getAnchorHandleAtCoords(coords);
          if (handle) {
            isDrawing = true;
            activeHandle = handle;
            startX = coords.x;
            startY = coords.y;
            originalTransformState = JSON.parse(JSON.stringify(transformBox));
            return;
          }
        }

        if (currentTool === 'select-poly') {
          const hitIdx = polyPoints.findIndex(pt => Math.hypot(pt.x - coords.x, pt.y - coords.y) <= 8);
          if (hitIdx !== -1) {
            draggingPolyPointIndex = hitIdx;
            isDrawing = true;
            return;
          }

          polyPoints.push({ x: coords.x, y: coords.y });
          renderSelectionOverlay();
          return;
        }

        if (currentTool === 'select-wand') {
          commitMove();
          performWandSelection(Math.floor(coords.x), Math.floor(coords.y));
          return;
        }

        if (['select-rect', 'select-oval', 'crop'].includes(currentTool)) {
          commitMove();
        }

        if (currentTool === 'text') {
          const activeTxtRot = textObjects.slice().reverse().find(txt => {
            compositeCtx.font = `${txt.fontSize}px ${txt.fontFamily}`;
            const metrics = compositeCtx.measureText(txt.text);
            const w = metrics.width;
            const h = txt.fontSize;
            const cx = txt.x + w / 2;
            const cy = txt.y + h / 2;

            const rad = -((txt.angle || 0) * Math.PI) / 180;
            const dx = coords.x - cx;
            const dy = coords.y - cy;
            const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

            return Math.hypot(localX, localY - (-h / 2 - 24)) <= 10;
          });

          if (activeTxtRot) {
            rotatingTextObject = activeTxtRot;
            isDrawing = true;
            return;
          }

          const clickedText = textObjects.slice().reverse().find(txt => {
            compositeCtx.font = `${txt.fontSize}px ${txt.fontFamily}`;
            const metrics = compositeCtx.measureText(txt.text);
            const w = metrics.width;
            const h = txt.fontSize;
            const cx = txt.x + w / 2;
            const cy = txt.y + h / 2;

            const rad = -((txt.angle || 0) * Math.PI) / 180;
            const dx = coords.x - cx;
            const dy = coords.y - cy;
            const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

            return Math.abs(localX) <= w / 2 && Math.abs(localY) <= h / 2;
          });

          if (clickedText) {
            draggingTextObject = clickedText;
            dragTextOffsetX = coords.x - clickedText.x;
            dragTextOffsetY = coords.y - clickedText.y;
            isDrawing = true;
          } else {
            openTextModalForNew(coords.x, coords.y);
          }
          return;
        }

        isDrawing = true;
        startX = coords.x;
        startY = coords.y;
        lastX = coords.x;
        lastY = coords.y;

        if (activeLayerIndex >= 0) {
          const activeLayer = layers[activeLayerIndex];

          if (currentTool === 'move') {
            startMoveSession();
          } else if (currentTool === 'shape') {
            tempCanvasState = activeLayer.ctx.getImageData(0, 0, canvasWidth, canvasHeight);
          }
        }

        if (currentTool === 'brush' || currentTool === 'eraser') {
          drawStroke(coords.x, coords.y, true);
        } else if (currentTool === 'bucket') {
          floodFill(Math.floor(coords.x), Math.floor(coords.y), primaryColor);
          renderCompositeCanvas();
          renderLayersList();
          saveHistoryState('Preenchimento');
        } else if (currentTool === 'picker') {
          pickColor(coords.x, coords.y);
        }
      };

      const moveAction = (e) => {
        if (!isDrawing || isPanning) return;
        const coords = getCanvasCoords(e);

        if (currentTool === 'text' && rotatingTextObject) {
          const txtObj = rotatingTextObject;
          compositeCtx.font = `${txtObj.fontSize}px ${txtObj.fontFamily}`;
          const metrics = compositeCtx.measureText(txtObj.text);
          const cx = txtObj.x + metrics.width / 2;
          const cy = txtObj.y + txtObj.fontSize / 2;

          const angleRad = Math.atan2(coords.y - cy, coords.x - cx);
          let deg = (angleRad * 180) / Math.PI + 90;
          txtObj.angle = Math.round(deg);
          renderCompositeCanvas();
          return;
        }

        if (currentTool === 'text' && draggingTextObject) {
          draggingTextObject.x = coords.x - dragTextOffsetX;
          draggingTextObject.y = coords.y - dragTextOffsetY;
          renderCompositeCanvas();
          return;
        }

        if (currentTool === 'select-poly' && draggingPolyPointIndex !== -1) {
          polyPoints[draggingPolyPointIndex].x = coords.x;
          polyPoints[draggingPolyPointIndex].y = coords.y;
          renderSelectionOverlay();
          return;
        }

        if (activeTransformSession && activeHandle && originalTransformState) {
          const dx = coords.x - startX;
          const dy = coords.y - startY;

          if (activeHandle === 'rotate') {
            const cx = originalTransformState.x + (originalTransformState.width * originalTransformState.scaleX) / 2;
            const cy = originalTransformState.y + (originalTransformState.height * originalTransformState.scaleY) / 2;
            const angleRad = Math.atan2(coords.y - cy, coords.x - cx);
            let deg = (angleRad * 180) / Math.PI + 90;
            transformBox.angle = deg;
          } else if (activeHandle === 'center') {
            transformBox.x = originalTransformState.x + dx;
            transformBox.y = originalTransformState.y + dy;
          } else {
            let dw = dx, dh = dy;
            if (activeHandle.includes('r')) transformBox.scaleX = Math.max(0.1, (originalTransformState.width * originalTransformState.scaleX + dw) / originalTransformState.width);
            if (activeHandle.includes('l')) {
              transformBox.scaleX = Math.max(0.1, (originalTransformState.width * originalTransformState.scaleX - dw) / originalTransformState.width);
              transformBox.x = originalTransformState.x + dw;
            }
            if (activeHandle.includes('b')) transformBox.scaleY = Math.max(0.1, (originalTransformState.height * originalTransformState.scaleY + dh) / originalTransformState.height);
            if (activeHandle.includes('t')) {
              transformBox.scaleY = Math.max(0.1, (originalTransformState.height * originalTransformState.scaleY - dh) / originalTransformState.height);
              transformBox.y = originalTransformState.y + dh;
            }
          }

          renderCompositeCanvas();
          renderSelectionOverlay();
          renderToolProperties();
          return;
        }

        if (currentTool === 'zoom') {
          zoomBox = {
            x: Math.min(startX, coords.x),
            y: Math.min(startY, coords.y),
            w: Math.abs(coords.x - startX),
            h: Math.abs(coords.y - startY)
          };
          renderSelectionOverlay();
          return;
        }

        if (activeLayerIndex < 0) return;

        if (currentTool === 'move') {
          const dx = coords.x - startX;
          const dy = coords.y - startY;
          applyNudge(dx, dy);
          startX = coords.x;
          startY = coords.y;
        } else if (currentTool === 'brush' || currentTool === 'eraser') {
          drawStroke(coords.x, coords.y, false);
        } else if (currentTool === 'shape') {
          layers[activeLayerIndex].ctx.putImageData(tempCanvasState, 0, 0);
          drawPreviewShape(layers[activeLayerIndex].ctx, startX, startY, coords.x, coords.y);
          renderCompositeCanvas();
        } else if (currentTool === 'select-rect' || currentTool === 'crop') {
          updateRectSelection(startX, startY, coords.x, coords.y);
        } else if (currentTool === 'select-oval') {
          updateOvalSelection(startX, startY, coords.x, coords.y);
        }

        lastX = coords.x;
        lastY = coords.y;
      };

      const endAction = (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        activeHandle = null;

        if (currentTool === 'text' && rotatingTextObject) {
          rotatingTextObject = null;
          renderCompositeCanvas();
          renderTextObjectsList();
          saveHistoryState('Rodar Objeto de Texto');
          return;
        }

        if (currentTool === 'text' && draggingTextObject) {
          draggingTextObject = null;
          saveHistoryState('Mover Objeto de Texto');
          return;
        }

        if (draggingPolyPointIndex !== -1) {
          draggingPolyPointIndex = -1;
          renderSelectionOverlay();
          return;
        }

        if (currentTool === 'zoom') {
          const coords = getCanvasCoords(e);
          zoomToArea(startX, startY, coords.x, coords.y);
          zoomBox = null;
          renderSelectionOverlay();
          return;
        }

        if (currentTool === 'crop') {
          applyCropToSelection();
          return;
        }

        if (['brush', 'eraser', 'shape'].includes(currentTool)) {
          renderCompositeCanvas();
          saveHistoryState(getToolName(currentTool));
        } else if (['select-rect', 'select-oval'].includes(currentTool)) {
          saveHistoryState('Seleção');
        }
      };

      viewport.addEventListener('mousedown', startAction);
      window.addEventListener('mousemove', moveAction);
      window.addEventListener('mouseup', endAction);

      viewport.addEventListener('dblclick', (e) => {
        if (currentTool === 'text') {
          const coords = getCanvasCoords(e);
          const clickedText = textObjects.slice().reverse().find(txt => {
            compositeCtx.font = `${txt.fontSize}px ${txt.fontFamily}`;
            const metrics = compositeCtx.measureText(txt.text);
            const w = metrics.width;
            const h = txt.fontSize;
            const cx = txt.x + w / 2;
            const cy = txt.y + h / 2;

            const rad = -((txt.angle || 0) * Math.PI) / 180;
            const dx = coords.x - cx;
            const dy = coords.y - cy;
            const localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            const localY = dx * Math.sin(rad) + dy * Math.cos(rad);

            return Math.abs(localX) <= w / 2 && Math.abs(localY) <= h / 2;
          });
          if (clickedText) {
            openTextModalForEdit(clickedText.id);
          }
        }
        if (currentTool === 'select-poly') {
          finishPolySelection();
        }
      });
    }

    function openTextModalForNew(x, y) {
      activeTextObjectId = null;
      document.getElementById('textModalContent').value = 'Novo Texto';
      document.getElementById('textModalSize').value = 32;
      document.getElementById('textModalAngle').value = 0;
      document.getElementById('textModalFont').value = 'Inter, sans-serif';
      document.getElementById('textModalColor').value = primaryColor;
      document.getElementById('textModalDeleteBtn').classList.add('hidden');

      window._tempTextX = x;
      window._tempTextY = y;

      const modal = document.getElementById('textEditorModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('textModalContent').focus();
    }

    function openTextModalForEdit(id) {
      const txtObj = textObjects.find(t => t.id === id);
      if (!txtObj) return;

      activeTextObjectId = id;
      document.getElementById('textModalContent').value = txtObj.text;
      document.getElementById('textModalSize').value = txtObj.fontSize;
      document.getElementById('textModalAngle').value = txtObj.angle || 0;
      document.getElementById('textModalFont').value = txtObj.fontFamily;
      document.getElementById('textModalColor').value = txtObj.color || primaryColor;
      document.getElementById('textModalDeleteBtn').classList.remove('hidden');

      const modal = document.getElementById('textEditorModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('textModalContent').focus();
    }

    function closeTextModal() {
      const modal = document.getElementById('textEditorModal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    }

    function saveTextObjectConfirm() {
      const textVal = document.getElementById('textModalContent').value;
      const sizeVal = parseInt(document.getElementById('textModalSize').value) || 24;
      const angleVal = parseFloat(document.getElementById('textModalAngle').value) || 0;
      const fontVal = document.getElementById('textModalFont').value;
      const colorVal = document.getElementById('textModalColor').value;

      if (!textVal.trim()) {
        showToast('O texto não pode estar vazio');
        return;
      }

      if (activeTextObjectId !== null) {
        const txtObj = textObjects.find(t => t.id === activeTextObjectId);
        if (txtObj) {
          txtObj.text = textVal;
          txtObj.fontSize = sizeVal;
          txtObj.angle = angleVal;
          txtObj.fontFamily = fontVal;
          txtObj.color = colorVal;
          saveHistoryState('Editar Objeto de Texto');
        }
      } else {
        textObjects.push({
          id: textCounter++,
          text: textVal,
          x: window._tempTextX || 50,
          y: window._tempTextY || 50,
          fontSize: sizeVal,
          angle: angleVal,
          fontFamily: fontVal,
          color: colorVal
        });
        saveHistoryState('Adicionar Objeto de Texto');
      }

      closeTextModal();
      renderTextObjectsList();
      renderCompositeCanvas();
      showToast('Objeto de texto guardado');
    }

    function deleteCurrentTextObject() {
      if (activeTextObjectId === null) return;
      textObjects = textObjects.filter(t => t.id !== activeTextObjectId);
      closeTextModal();
      renderTextObjectsList();
      renderCompositeCanvas();
      saveHistoryState('Eliminar Objeto de Texto');
      showToast('Objeto de texto eliminado');
    }

    function startMoveSession() {
      if (activeLayerIndex < 0) return;
      const activeLayer = layers[activeLayerIndex];

      if (!moveSessionActive) {
        moveSessionActive = true;
        moveTotalDx = 0;
        moveTotalDy = 0;

        if (hasActiveSelection) {
          moveSelectedContentCanvas = document.createElement('canvas');
          moveSelectedContentCanvas.width = canvasWidth;
          moveSelectedContentCanvas.height = canvasHeight;
          const scCtx = moveSelectedContentCanvas.getContext('2d');

          scCtx.drawImage(activeLayer.canvas, 0, 0);
          scCtx.globalCompositeOperation = 'destination-in';
          scCtx.drawImage(selectionMaskCanvas, 0, 0);

          activeLayer.ctx.save();
          activeLayer.ctx.globalCompositeOperation = 'destination-out';
          activeLayer.ctx.drawImage(selectionMaskCanvas, 0, 0);
          activeLayer.ctx.restore();

          moveInitialLayerCanvas = document.createElement('canvas');
          moveInitialLayerCanvas.width = canvasWidth;
          moveInitialLayerCanvas.height = canvasHeight;
          moveInitialLayerCanvas.getContext('2d').drawImage(activeLayer.canvas, 0, 0);

          moveInitialMaskCanvas = document.createElement('canvas');
          moveInitialMaskCanvas.width = canvasWidth;
          moveInitialMaskCanvas.height = canvasHeight;
          moveInitialMaskCanvas.getContext('2d').drawImage(selectionMaskCanvas, 0, 0);
        } else {
          moveInitialLayerCanvas = document.createElement('canvas');
          moveInitialLayerCanvas.width = canvasWidth;
          moveInitialLayerCanvas.height = canvasHeight;
          moveInitialLayerCanvas.getContext('2d').drawImage(activeLayer.canvas, 0, 0);
        }
      }
    }

    function applyNudge(deltaX, deltaY) {
      if (activeLayerIndex < 0) return;
      if (!moveSessionActive) {
        startMoveSession();
      }

      moveTotalDx += deltaX;
      moveTotalDy += deltaY;

      const activeLayer = layers[activeLayerIndex];
      activeLayer.ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      if (hasActiveSelection && moveSelectedContentCanvas) {
        activeLayer.ctx.drawImage(moveInitialLayerCanvas, 0, 0);
        activeLayer.ctx.drawImage(moveSelectedContentCanvas, moveTotalDx, moveTotalDy);

        selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);
        selectionMaskCtx.drawImage(moveInitialMaskCanvas, moveTotalDx, moveTotalDy);

        activeSelectionPath = new Path2D();
        activeSelectionPath.rect(moveTotalDx, moveTotalDy, canvasWidth, canvasHeight);

        renderSelectionOverlay();
      } else {
        activeLayer.ctx.drawImage(moveInitialLayerCanvas, moveTotalDx, moveTotalDy);
      }

      renderCompositeCanvas();
    }

    function updateRectSelection(x1, y1, x2, y2) {
      selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);
      selectionMaskCtx.fillStyle = '#ffffff';
      
      const rx = Math.min(x1, x2);
      const ry = Math.min(y1, y2);
      const rw = Math.abs(x2 - x1);
      const rh = Math.abs(y2 - y1);

      if (rw > 2 && rh > 2) {
        selectionMaskCtx.fillRect(rx, ry, rw, rh);
        hasActiveSelection = true;
        activeSelectionPath = new Path2D();
        activeSelectionPath.rect(rx, ry, rw, rh);
      } else {
        hasActiveSelection = false;
        activeSelectionPath = null;
      }
      renderSelectionOverlay();
    }

    function updateOvalSelection(x1, y1, x2, y2) {
      selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);
      selectionMaskCtx.fillStyle = '#ffffff';

      const rx = Math.abs(x2 - x1) / 2;
      const ry = Math.abs(y2 - y1) / 2;
      const cx = Math.min(x1, x2) + rx;
      const cy = Math.min(y1, y2) + ry;

      if (rx > 1 && ry > 1) {
        selectionMaskCtx.beginPath();
        selectionMaskCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        selectionMaskCtx.fill();
        hasActiveSelection = true;
        activeSelectionPath = new Path2D();
        activeSelectionPath.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      } else {
        hasActiveSelection = false;
        activeSelectionPath = null;
      }
      renderSelectionOverlay();
    }

    function finishPolySelection() {
      if (polyPoints.length < 3) {
        polyPoints = [];
        renderSelectionOverlay();
        return;
      }

      selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);
      selectionMaskCtx.fillStyle = '#ffffff';
      
      activeSelectionPath = new Path2D();
      activeSelectionPath.moveTo(polyPoints[0].x, polyPoints[0].y);
      selectionMaskCtx.beginPath();
      selectionMaskCtx.moveTo(polyPoints[0].x, polyPoints[0].y);

      for (let i = 1; i < polyPoints.length; i++) {
        selectionMaskCtx.lineTo(polyPoints[i].x, polyPoints[i].y);
        activeSelectionPath.lineTo(polyPoints[i].x, polyPoints[i].y);
      }

      selectionMaskCtx.closePath();
      selectionMaskCtx.fill();
      activeSelectionPath.closePath();

      hasActiveSelection = true;
      polyPoints = [];
      renderSelectionOverlay();
      saveHistoryState('Seleção Poligonal');
    }

    function performWandSelection(startX, startY) {
      startX = Math.floor(startX);
      startY = Math.floor(startY);
      if (startX < 0 || startY < 0 || startX >= canvasWidth || startY >= canvasHeight) return;

      const imgData = compositeCtx.getImageData(0, 0, canvasWidth, canvasHeight);
      const data = imgData.data;
      const pixelCount = canvasWidth * canvasHeight;
      const seedPos = startY * canvasWidth + startX;
      const seedIdx = seedPos * 4;
      const targetR = data[seedIdx], targetG = data[seedIdx + 1];
      const targetB = data[seedIdx + 2], targetA = data[seedIdx + 3];
      const tolerance = Math.max(0, Math.min(100, Number(wandTolerance) || 0));
      const threshold = tolerance * 4;
      const colorMatch = (idx) => {
        const alphaDiff = Math.abs(data[idx + 3] - targetA);
        if (alphaDiff > threshold) return false;
        if (targetA === 0 && data[idx + 3] === 0) return true;
        const rgbDiff = Math.abs(data[idx] - targetR) +
          Math.abs(data[idx + 1] - targetG) + Math.abs(data[idx + 2] - targetB);
        return rgbDiff <= threshold;
      };

      const maskImg = selectionMaskCtx.createImageData(canvasWidth, canvasHeight);
      const maskData = maskImg.data;
      const visited = new Uint8Array(pixelCount);
      const queue = new Int32Array(pixelCount);
      let head = 0, tail = 0;
      queue[tail++] = seedPos;
      visited[seedPos] = 1;

      while (head < tail) {
        const pos = queue[head++];
        const idx = pos * 4;
        if (!colorMatch(idx)) continue;

        maskData[idx] = 255;
        maskData[idx + 1] = 255;
        maskData[idx + 2] = 255;
        maskData[idx + 3] = 255;

        const x = pos % canvasWidth;
        const y = (pos / canvasWidth) | 0;
        const neighbors = [];
        if (x > 0) neighbors.push(pos - 1);
        if (x < canvasWidth - 1) neighbors.push(pos + 1);
        if (y > 0) neighbors.push(pos - canvasWidth);
        if (y < canvasHeight - 1) neighbors.push(pos + canvasWidth);
        for (let i = 0; i < neighbors.length; i++) {
          const n = neighbors[i];
          if (!visited[n]) {
            visited[n] = 1;
            if (colorMatch(n * 4)) queue[tail++] = n;
          }
        }
      }

      selectionMaskCtx.putImageData(maskImg, 0, 0);

      const path = new Path2D();
      const selected = (x, y) => x >= 0 && y >= 0 && x < canvasWidth && y < canvasHeight &&
        maskData[(y * canvasWidth + x) * 4 + 3] > 0;
      for (let y = 0; y < canvasHeight; y++) {
        for (let x = 0; x < canvasWidth; x++) {
          if (!selected(x, y)) continue;
          if (!selected(x, y - 1)) { path.moveTo(x, y); path.lineTo(x + 1, y); }
          if (!selected(x + 1, y)) { path.moveTo(x + 1, y); path.lineTo(x + 1, y + 1); }
          if (!selected(x, y + 1)) { path.moveTo(x + 1, y + 1); path.lineTo(x, y + 1); }
          if (!selected(x - 1, y)) { path.moveTo(x, y + 1); path.lineTo(x, y); }
        }
      }

      hasActiveSelection = tail > 0;
      activeSelectionPath = hasActiveSelection ? path : null;
      polyPoints = [];
      renderSelectionOverlay();
      saveHistoryState('Seleção por Varinha Mágica');
      showToast(hasActiveSelection ? 'Seleção aplicada' : 'Nenhuma área seleccionada');
    }

    function drawStroke(x, y, isStart) {
      if (activeLayerIndex < 0) return;
      const ctx = layers[activeLayerIndex].ctx;

      ctx.save();
      if (hasActiveSelection && activeSelectionPath) ctx.clip(activeSelectionPath);

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = brushSize;

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = brushOpacity;
        ctx.strokeStyle = primaryColor;
      }

      ctx.beginPath();
      if (isStart) { ctx.moveTo(x, y); ctx.lineTo(x, y); }
      else { ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); }
      ctx.stroke();
      ctx.restore();

      renderCompositeCanvas();
    }

    function drawPreviewShape(ctx, x1, y1, x2, y2) {
      ctx.save();
      if (hasActiveSelection && activeSelectionPath) ctx.clip(activeSelectionPath);

      ctx.fillStyle = primaryColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = brushSize;
      ctx.globalAlpha = brushOpacity;

      ctx.beginPath();
      if (shapeType === 'shape-rect') {
        const w = x2 - x1, h = y2 - y1;
        if (shapeFill) ctx.fillRect(x1, y1, w, h);
        ctx.strokeRect(x1, y1, w, h);
      } else if (shapeType === 'shape-circle') {
        const rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
        const cx = Math.min(x1, x2) + rx, cy = Math.min(y1, y2) + ry;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        if (shapeFill) ctx.fill();
        ctx.stroke();
      } else if (shapeType === 'shape-line') {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      } else if (shapeType === 'shape-poly') {
        const rx = Math.abs(x2 - x1) / 2, ry = Math.abs(y2 - y1) / 2;
        const cx = Math.min(x1, x2) + rx, cy = Math.min(y1, y2) + ry;
        const sides = 5;
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
          const px = cx + rx * Math.cos(angle);
          const py = cy + ry * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        if (shapeFill) ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function floodFill(startX, startY, fillColorHex) {
      commitMove();
      if (activeLayerIndex < 0) return;

      const targetLayer = layers[activeLayerIndex];
      const targetCtx = targetLayer.ctx;
      const sourceCtx = bucketSampleAllLayers ? compositeCtx : targetCtx;
      const sampleData = sourceCtx.getImageData(0, 0, canvasWidth, canvasHeight).data;
      const targetLayerDataObj = targetCtx.getImageData(0, 0, canvasWidth, canvasHeight);
      const targetLayerData = targetLayerDataObj.data;

      const fillColor = hexToRgb(fillColorHex);
      const targetPos = (startY * canvasWidth + startX) * 4;

      const targetR = sampleData[targetPos];
      const targetG = sampleData[targetPos + 1];
      const targetB = sampleData[targetPos + 2];
      const targetA = sampleData[targetPos + 3];

      const maskData = hasActiveSelection ? selectionMaskCtx.getImageData(0, 0, canvasWidth, canvasHeight).data : null;
      const pixelsToCheck = [startX, startY];
      const visited = new Uint8Array(canvasWidth * canvasHeight);

      const colorMatch = (pos) => {
        const r = sampleData[pos], g = sampleData[pos + 1], b = sampleData[pos + 2], a = sampleData[pos + 3];
        return Math.abs(r - targetR) <= 30 &&
               Math.abs(g - targetG) <= 30 &&
               Math.abs(b - targetB) <= 30 &&
               Math.abs(a - targetA) <= 30;
      };

      while (pixelsToCheck.length > 0) {
        const y = pixelsToCheck.pop();
        const x = pixelsToCheck.pop();
        const pixelIndex = y * canvasWidth + x;

        if (visited[pixelIndex]) continue;
        visited[pixelIndex] = 1;

        const pos = pixelIndex * 4;
        if (hasActiveSelection && maskData[pos + 3] === 0) continue;

        if (colorMatch(pos)) {
          targetLayerData[pos] = fillColor.r;
          targetLayerData[pos + 1] = fillColor.g;
          targetLayerData[pos + 2] = fillColor.b;
          targetLayerData[pos + 3] = 255;

          if (x > 0) pixelsToCheck.push(x - 1, y);
          if (x < canvasWidth - 1) pixelsToCheck.push(x + 1, y);
          if (y > 0) pixelsToCheck.push(x, y - 1);
          if (y < canvasHeight - 1) pixelsToCheck.push(x, y + 1);
        }
      }

      targetCtx.putImageData(targetLayerDataObj, 0, 0);
    }

    function getSelectionBoundingBox() {
      if (!hasActiveSelection) {
        return { minX: 0, minY: 0, maxX: canvasWidth, maxY: canvasHeight, width: canvasWidth, height: canvasHeight };
      }

      const maskData = selectionMaskCtx.getImageData(0, 0, canvasWidth, canvasHeight).data;
      let minX = canvasWidth, minY = canvasHeight, maxX = 0, maxY = 0;
      let found = false;

      for (let y = 0; y < canvasHeight; y++) {
        for (let x = 0; x < canvasWidth; x++) {
          if (maskData[(y * canvasWidth + x) * 4 + 3] > 0) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!found) return { minX: 0, minY: 0, maxX: canvasWidth, maxY: canvasHeight, width: canvasWidth, height: canvasHeight };

      return {
        minX: minX, minY: minY, maxX: maxX + 1, maxY: maxY + 1,
        width: Math.max(1, (maxX - minX) + 1), height: Math.max(1, (maxY - minY) + 1)
      };
    }

    async function copySelection() {
      if (activeLayerIndex < 0) return;
      commitMove();

      const bounds = getSelectionBoundingBox();
      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = bounds.width;
      croppedCanvas.height = bounds.height;
      const cCtx = croppedCanvas.getContext('2d');

      if (hasActiveSelection) {
        const tempFull = document.createElement('canvas');
        tempFull.width = canvasWidth;
        tempFull.height = canvasHeight;
        const tfCtx = tempFull.getContext('2d');

        tfCtx.drawImage(layers[activeLayerIndex].canvas, 0, 0);
        tfCtx.globalCompositeOperation = 'destination-in';
        tfCtx.drawImage(selectionMaskCanvas, 0, 0);

        cCtx.drawImage(tempFull, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
      } else {
        cCtx.drawImage(layers[activeLayerIndex].canvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);
      }

      internalClipboardData = {
        canvas: croppedCanvas,
        width: bounds.width,
        height: bounds.height
      };

      try {
        croppedCanvas.toBlob(async (blob) => {
          if (blob && navigator.clipboard && navigator.clipboard.write) {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          }
        });
      } catch (e) {
        console.warn('Clipboard nativo bloqueado.');
      }

      showToast('Seleção copiada');
    }

    async function cutSelection() {
      if (activeLayerIndex < 0) return;
      await copySelection();

      const ctx = layers[activeLayerIndex].ctx;
      ctx.save();
      if (hasActiveSelection) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(selectionMaskCanvas, 0, 0);
      } else {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      }
      ctx.restore();

      renderCompositeCanvas();
      saveHistoryState('Cortar Seleção');
      showToast('Seleção cortada');
    }

    async function pasteSelection() {
      let pasted = false;

      if (navigator.clipboard && navigator.clipboard.read) {
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            const type = item.types.find(t => t.startsWith('image/'));
            if (type) {
              const blob = await item.getType(type);
              const img = new Image();
              const url = URL.createObjectURL(blob);
              await new Promise((resolve) => {
                img.onload = () => {
                  const tempCanvas = document.createElement('canvas');
                  tempCanvas.width = img.width;
                  tempCanvas.height = img.height;
                  tempCanvas.getContext('2d').drawImage(img, 0, 0);
                  pasteCanvasAsNewLayer(tempCanvas);
                  URL.revokeObjectURL(url);
                  pasted = true;
                  resolve();
                };
                img.src = url;
              });
              if (pasted) break;
            }
          }
        } catch (err) {
          console.warn('Falha no clipboard nativo.');
        }
      }

      if (!pasted) {
        if (internalClipboardData && internalClipboardData.canvas) {
          pasteCanvasAsNewLayer(internalClipboardData.canvas);
        } else {
          showToast('Nenhum conteúdo na memória');
        }
      }
    }

    function pasteCanvasAsNewLayer(srcCanvas) {
      const posX = Math.round((canvasWidth - srcCanvas.width) / 2);
      const posY = Math.round((canvasHeight - srcCanvas.height) / 2);

      deselectAll();
      const newLayer = addNewLayer('Camada Colada', srcCanvas, posX, posY);

      selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);
      selectionMaskCtx.fillStyle = '#ffffff';
      selectionMaskCtx.fillRect(posX, posY, srcCanvas.width, srcCanvas.height);
      hasActiveSelection = true;
      activeSelectionPath = new Path2D();
      activeSelectionPath.rect(posX, posY, srcCanvas.width, srcCanvas.height);

      selectTool('move');
      renderCompositeCanvas();
      renderSelectionOverlay();
      showToast('Elemento colado.');
    }

    function clearSelectionArea() {
      commitMove();
      if (activeLayerIndex < 0) return;
      const ctx = layers[activeLayerIndex].ctx;

      ctx.save();
      if (hasActiveSelection) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(selectionMaskCanvas, 0, 0);
      } else {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      }
      ctx.restore();

      renderCompositeCanvas();
      saveHistoryState('Limpar Seleção');
      showToast('Área limpa');
    }

    function setupClipboardEvents() {
      window.addEventListener('paste', (e) => {
        if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
          const file = e.clipboardData.files[0];
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const img = new Image();
              img.onload = () => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                tempCanvas.getContext('2d').drawImage(img, 0, 0);
                pasteCanvasAsNewLayer(tempCanvas);
              };
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          }
        }
      });
    }

    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          openNewApplicationTab();
          return;
        }

        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        if (e.key === 'Enter') {
          if (activeTransformSession) { confirmTransformSession(); return; }
          if (currentTool === 'select-poly') { finishPolySelection(); return; }
        }

        if (e.key === 'Escape' && activeTransformSession) {
          cancelTransformSession();
          return;
        }

        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
          e.preventDefault();
          const step = e.shiftKey ? 10 : 1;
          let dx = 0, dy = 0;
          if (e.code === 'ArrowLeft') dx = -step;
          if (e.code === 'ArrowRight') dx = step;
          if (e.code === 'ArrowUp') dy = -step;
          if (e.code === 'ArrowDown') dy = step;

          if (currentTool !== 'move') selectTool('move');
          applyNudge(dx, dy);
          return;
        }

        if (e.code === 'Space' && !isSpacePressed) {
          isSpacePressed = true;
          updateWorkbenchCursor();
          e.preventDefault();
        }

        if (e.ctrlKey || e.metaKey) {
          const key = e.key.toLowerCase();
          if (key === 'a') { e.preventDefault(); selectAll(); }
          else if (key === 'd') { e.preventDefault(); deselectAll(); }
          else if (key === 'i') { e.preventDefault(); invertSelection(); }
          else if (key === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
          else if (key === 'y') { e.preventDefault(); redo(); }
          else if (key === 'x') { e.preventDefault(); cutSelection(); }
          else if (key === 'c') { e.preventDefault(); copySelection(); }
          else if (key === 'v') { e.preventDefault(); pasteSelection(); }
          else if (key === 's') { e.preventDefault(); saveProject(e.shiftKey); }
          return;
        }

        if (e.key === 'Delete' || e.key === 'Backspace') {
          clearSelectionArea();
          return;
        }

        switch (e.key.toLowerCase()) {
          case 'a': selectTool('pointer'); break;
          case 'm': selectToolFromSelectionGroup('select-rect'); break;
          case 'l': selectToolFromSelectionGroup('select-oval'); break;
          case 'p': selectToolFromSelectionGroup('select-poly'); break;
          case 'w': selectToolFromSelectionGroup('select-wand'); break;
          case 'b': selectTool('brush'); break;
          case 'e': selectTool('eraser'); break;
          case 'v': selectTool('move'); break;
          case 'r': selectToolFromGroup('rotate'); break;
          case 's': 
            if (e.shiftKey) selectToolFromGroup('scale');
            else selectToolFromGroup('shear'); 
            break;
          case 'f': selectToolFromGroup('flip'); break;
          case 'g': selectTool('bucket'); break;
          case 'u': selectToolFromShapeGroup('shape-rect'); break;
          case 't': selectTool('text'); break;
          case 'i': selectTool('picker'); break;
          case 'z': selectTool('zoom'); break;
          case 'x': swapColors(); break;
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
          isSpacePressed = false;
          updateWorkbenchCursor();
        }
      });
    }

    async function saveProject(saveAs = false) {
      commitMove();
      cancelTransformSession();
      const projectData = {
        version: "1.2",
        width: canvasWidth,
        height: canvasHeight,
        textObjects: textObjects,
        layers: layers.map(l => ({
          id: l.id, name: l.name, visible: l.visible, opacity: l.opacity, blendMode: l.blendMode,
          dataUrl: l.canvas.toDataURL('image/png')
        }))
      };

      const jsonString = JSON.stringify(projectData, null, 2);

      if ('showSaveFilePicker' in window && !saveAs && fileHandle) {
        try {
          const writable = await fileHandle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showToast(`Projeto guardado em ${fileHandle.name}`);
          return;
        } catch (err) { console.warn(err); }
      }

      if ('showSaveFilePicker' in window) {
        try {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: projectFileName,
            types: [{ description: 'Projeto GIMP Web', accept: { 'application/json': ['.gimpweb'] } }]
          });
          projectFileName = fileHandle.name;
          document.getElementById('file-name-display').innerText = projectFileName;

          const writable = await fileHandle.createWritable();
          await writable.write(jsonString);
          await writable.close();
          showToast(`Projeto guardado como ${projectFileName}`);
          return;
        } catch (err) { if (err.name === 'AbortError') return; }
      }

      const blob = new Blob([jsonString], { type: 'application/json' });
      const link = document.createElement('a');
      link.download = projectFileName;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('Projeto guardado com sucesso');
    }

    function loadProjectFromFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      commitMove();
      cancelTransformSession();
      projectFileName = file.name;
      document.getElementById('file-name-display').innerText = projectFileName;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const project = JSON.parse(event.target.result);
          canvasWidth = project.width;
          canvasHeight = project.height;
          textObjects = project.textObjects || [];

          compositeCanvas.width = canvasWidth;
          compositeCanvas.height = canvasHeight;
          selectionCanvas.width = canvasWidth;
          selectionCanvas.height = canvasHeight;

          selectionMaskCanvas.width = canvasWidth;
          selectionMaskCanvas.height = canvasHeight;
          selectionMaskCtx.clearRect(0, 0, canvasWidth, canvasHeight);

          document.getElementById('image-dimensions-display').innerHTML = `<i class="fa-regular fa-image me-1"></i> ${canvasWidth} x ${canvasHeight} px`;

          layers = [];
          let loadedCount = 0;

          project.layers.forEach((lData, idx) => {
            const img = new Image();
            img.onload = () => {
              const lCanvas = document.createElement('canvas');
              lCanvas.width = canvasWidth;
              lCanvas.height = canvasHeight;
              const lCtx = lCanvas.getContext('2d');
              lCtx.drawImage(img, 0, 0);

              layers[idx] = {
                id: lData.id, name: lData.name, canvas: lCanvas, ctx: lCtx,
                visible: lData.visible, opacity: lData.opacity, blendMode: lData.blendMode
              };

              loadedCount++;
              if (loadedCount === project.layers.length) {
                activeLayerIndex = layers.length - 1;
                historyStack = []; historyIndex = -1;
                renderLayersList();
                renderTextObjectsList();
                renderCompositeCanvas();
                saveHistoryState('Abrir Projeto');
                resetZoom();
                showToast('Projeto carregado com sucesso');
              }
            };
            img.src = lData.dataUrl;
          });
        } catch (err) { alert('Ficheiro .gimpweb inválido.'); }
      };
      reader.readAsText(file);
    }

    function pickColor(x, y) {
      const p = compositeCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
      const hex = "#" + ("0" + p[0].toString(16)).slice(-2) + ("0" + p[1].toString(16)).slice(-2) + ("0" + p[2].toString(16)).slice(-2);
      primaryColor = hex;
      document.getElementById('primaryColorInput').value = hex;
      showToast(`Cor selecionada: ${hex.toUpperCase()}`);
    }

    function loadImageFromFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      commitMove();
      cancelTransformSession();
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          if (confirm('Deseja redimensionar a área de trabalho para o tamanho desta imagem?')) {
            initProject(img.width, img.height, 'transparent');
            layers[0].ctx.drawImage(img, 0, 0);
            layers[0].name = file.name;
          } else {
            addNewLayer(file.name);
            layers[activeLayerIndex].ctx.drawImage(img, 0, 0);
          }
          renderLayersList();
          renderCompositeCanvas();
          saveHistoryState('Importar Imagem');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function exportImage(format) {
      commitMove();
      cancelTransformSession();
      const link = document.createElement('a');
      link.download = `exportacao.${format}`;
      link.href = compositeCanvas.toDataURL(`image/${format}`, 0.95);
      link.click();
      showToast(`Exportado como ${format.toUpperCase()}`);
    }

    function updateColors() {
      primaryColor = document.getElementById('primaryColorInput').value;
      secondaryColor = document.getElementById('secondaryColorInput').value;
    }

    function swapColors() {
      const temp = primaryColor;
      primaryColor = secondaryColor;
      secondaryColor = temp;
      document.getElementById('primaryColorInput').value = primaryColor;
      document.getElementById('secondaryColorInput').value = secondaryColor;
    }

    function getToolName(tool) {
      const names = {
        brush: 'Pincel', eraser: 'Borracha', shape: 'Desenhar Forma',
        move: 'Mover Conteúdo', bucket: 'Preenchimento', rotate: 'Rodar',
        scale: 'Redimensionar', shear: 'Cisalhar', flip: 'Inverter', crop: 'Recortar',
        'select-rect': 'Seleção Retangular', 'select-oval': 'Seleção Elíptica',
        'select-poly': 'Seleção Poligonal', 'select-wand': 'Varinha Mágica',
        'shape-rect': 'Retângulo', 'shape-circle': 'Círculo', 'shape-poly': 'Polígono', 'shape-line': 'Linha'
      };
      return names[tool] || 'Ação';
    }

    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    // Abre outra instância completa do editor numa nova aba do navegador.
    // Cada aba possui seu próprio documento, camadas, histórico e ferramentas.
    function openNewApplicationTab() {
      const newTab = window.open(window.location.href, '_blank');

      if (newTab) {
        newTab.focus();
        showToast('Nova aba do editor aberta.');
      } else {
        showToast('O navegador bloqueou a nova aba. Permita pop-ups para este arquivo.');
      }
    }

    function openNewImageModal() {
      const modal = document.getElementById('newImageModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
    }

    function createNewImageConfirm() {
      const w = parseInt(document.getElementById('newWidth').value);
      const h = parseInt(document.getElementById('newHeight').value);
      const bg = document.getElementById('newBgType').value;

      if (w > 0 && h > 0) {
        initProject(w, h, bg);
        closeModal('newImageModal');
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('flex'); modal.classList.add('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
</body>
